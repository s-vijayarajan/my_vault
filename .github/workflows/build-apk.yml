name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - name: Test accounting engine and app
        run: npm test
      - name: Build web app and sync into Android project
        run: npm run cap:sync
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Verify the APK is a valid Android package
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" && unzip -tq "$APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee badging.txt | head -3
          grep -q "package: name='com.myvault.cashbook'" badging.txt
          grep -q "sdkVersion:'26'" badging.txt
          cp "$APK" MY-VAULT.apk
      - uses: actions/upload-artifact@v4
        with: { name: MY-VAULT-apk, path: MY-VAULT.apk, if-no-files-found: error }
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: MY-VAULT-apk }
